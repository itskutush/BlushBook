<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Secret Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;700&display=swap" rel="stylesheet">
    
</head>
<body class="bg-gray-100">

    <div id="book-container" class="book-container">
        
        <div id="book-cover" class="book-cover flex flex-col justify-center items-center cursor-pointer">
            <div class="book-cover-text">
                <h1 class="text-6xl font-bold text-white mb-4">My Secret Diary</h1>
                <p class="text-xl text-white italic">Tap to open...</p>
            </div>
            <div class="absolute bottom-6 text-white text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                </svg>
            </div>
        </div>

        <div id="login-page" class="login-page hidden opacity-0">
            <h1 class="text-4xl font-bold text-center mb-6">What's the secret password?</h1>
            <form id="password-form" class="flex flex-col items-center space-y-4">
                <input type="password" id="password-input" placeholder="Enter password..." class="diary-input w-full p-3 rounded-lg text-center max-w-sm">
                <button type="submit" class="diary-btn py-2 px-6 rounded-full text-lg">Enter</button>
            </form>
            <p id="password-error" class="text-red-500 mt-4 hidden">Oops! Wrong password. Try again!</p>
        </div>

        <div id="main-diary-content" class="main-diary-content hidden">
            <div id="userIdDisplay" class="absolute top-2 right-2 text-xs text-gray-500"></div>
            <h1 class="text-4xl font-bold text-center mb-6">My Secret Diary</h1>
            <p class="text-center text-lg italic mb-8">Shh... it's a secret!</p>

            <div id="loading" class="flex justify-center items-center h-48">
                <div class="spinner"></div>
            </div>
            
            <div id="latest-entry-container" class="space-y-8 h-full hidden">
                </div>

            <div id="write-entry-page" class="space-y-8 h-full hidden">
                <div id="new-entry-form-container" class="p-6 mt-8 rounded-2xl bg-white/50 border-2 border-dashed border-gray-300">
                    <h2 class="text-2xl font-bold mb-4">Write a New Entry</h2>
                    <form id="new-entry-form" class="space-y-4">
                        <input type="text" id="entry-title" placeholder="Title your feelings..." class="diary-input w-full p-3 rounded-lg">
                        <textarea id="entry-content" rows="6" placeholder="Spill your secrets here..." class="diary-input w-full p-3 rounded-lg"></textarea>
                        
                        <div>
                            <label for="media-upload" class="flex items-center space-x-2 text-lg text-gray-600 cursor-pointer hover:text-gray-900 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span>Add an image...</span>
                            </label>
                            <input type="file" id="media-upload" class="hidden" accept="image/*">
                            <div id="media-preview" class="mt-4 hidden max-h-48 overflow-hidden rounded-lg shadow-md">
                                <img id="preview-image" src="#" alt="Image Preview" class="w-full h-auto object-cover">
                            </div>
                        </div>

                        <div>
                            <label for="entry-color" class="flex items-center space-x-2 text-lg text-gray-600">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.172a2 2 0 00-1.414.586L11 14.586V19a2 2 0 002 2h2m-4-10h.01M17 10h.01" />
                                </svg>
                                <span>Choose text color...</span>
                            </label>
                            <input type="color" id="entry-color" value="#DAA520" class="mt-2 w-full h-12 rounded-lg border-2 border-accent-gold cursor-pointer">
                        </div>

                        <div class="flex flex-col items-center space-y-4">
                            <button type="submit" class="diary-btn py-2 px-6 rounded-full text-lg">Save Entry</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="nav-btn-container" class="flex justify-center mt-6 hidden">
                <button id="nav-write-btn" class="diary-btn py-2 px-4 rounded-full text-lg flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                    <span>Write a New Entry</span>
                </button>
            </div>
        </div>

    </div>

    
<script type="module" src="script.js"></script>
</body>
</html>
